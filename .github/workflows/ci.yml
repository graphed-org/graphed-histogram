name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # the former core/debug/frontend/numpy/awkward siblings are now one consolidated package
  GRAPHED: "graphed[awkward,numpy] @ git+https://github.com/graphed-org/graphed@559ed8d3c84e249e9898b6159b7860ef2ecf5530"
  # exec-local stays a separate package (used by the M23 process-executor integration tests)
  EXECLOCAL: "graphed-executors"

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.EXECLOCAL }}"
          python -m pip install -e ".[dev]"
      - uses: astral-sh/setup-uv@v5
      - name: Lint + types (pre-commit hooks via prek)
        run: uvx prek@0.4.5 run --all-files --show-diff-on-failure
      - name: Pytest + coverage
        run: >
          pytest tests/frozen tests/extra --cov=graphed_histogram --cov-branch
          --cov-report=term-missing --cov-report=json --cov-report=xml
      - name: Per-file coverage gate (>=90% each)
        run: python scripts/coverage_gate.py coverage.json
      # The delta gate governs PRs opened once this policy is on main; it is not a target for
      # the PR that lands it, so it runs informationally (no --fail-under) until main carries
      # scripts/coverage_gate.py, and only on one leg to avoid 16x redundant diff-cover runs.
      - name: Diff coverage (>=98% of changed lines vs main)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          git fetch origin main
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98
          else
            diff-cover coverage.xml --compare-branch=origin/main || true
          fi

  # Free-threaded / bleeding-edge Pythons (plan A.5): genuinely exercises concurrency under no-GIL.
  # Experimental + non-blocking (awkward wheels may lag on 3.14 / 3.14t).
  test-experimental:
    name: test (experimental) py${{ matrix.python }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.EXECLOCAL }}"
          python -m pip install -e ".[dev]"
          pytest tests/frozen

  docs:
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          # graphed comes from the pinned git sha above, not PyPI: the suites here track its tip
          python -m pip install "${{ env.GRAPHED }}"
          python -m pip install -e ".[docs]"
          sphinx-build -W -b html docs docs/_build/html

  # The single check the ruleset requires for the merge queue: matrix legs would each need
  # naming there, and advisory (continue-on-error) jobs are left out on purpose.
  ci-required:
    name: ci required
    if: always()
    needs: [test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
