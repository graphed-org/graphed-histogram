name: probe-mem (temporary)
on:
  push:
    branches: [fix/histserv-memory-baseline]
env:
  GRAPHED: "graphed[awkward,numpy]==0.0.8"
  EXECLOCAL: "graphed-executors"
jobs:
  probe:
    name: probe ${{ matrix.os }} py${{ matrix.python }} r${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13", "3.14"]
        rep: [1]
        include:
          - {os: ubuntu-latest, python: "3.14", rep: 2}
          - {os: ubuntu-latest, python: "3.14", rep: 3}
          - {os: ubuntu-latest, python: "3.14", rep: 4}
          - {os: ubuntu-latest, python: "3.14", rep: 5}
          - {os: ubuntu-latest, python: "3.14", rep: 6}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "${{ env.GRAPHED }}" "${{ env.EXECLOCAL }}"
          python -m pip install -q -e ".[dev,histserv]" psutil
          sudo mkdir -p /p && sudo cp ci-probe/announce_db8fb0a.py /p/
      - name: Probe
        run: |
          echo "PROBE image=$ImageVersion kernel=$(uname -r) python=$(python -VV | tr '\n' ' ')"
          python -c "import re;r=lambda k:int(re.search(k+r':\s+(\d+)',open('/proc/self/status').read())[1])/1024;f=lambda:' '.join(f'{k}={r(k):.1f}' for k in ('VmRSS','RssAnon','RssFile'));a=f();import grpc;b=f();import histserv.service;c=f();print(f'PROBE bare[{a}] +grpc[{b}] +histserv.service[{c}] MiB')"
          cat /sys/kernel/mm/transparent_hugepage/enabled | sed 's/^/PROBE thp=/'
          (cd ci-probe && python probe_histserv_memory.py) 2>&1 | grep -E 'A warm idle|^J |^MODEL' | sed 's/^/PROBE plan /'
          run() { PYTHONPATH=ci-probe python -m pytest -p probe_mem -p no:cacheprovider -q -s -rf tests/frozen/m69b/test_histserv_memory_model.py 2>&1 | grep -E '^PROBE|passed|failed|^FAILED' | cut -c1-220 | sed "s/^/[$1] /"; }
          base() { git checkout -q origin/main -- tests/frozen/m69b src; }
          tip() { git checkout -q HEAD -- tests/frozen/m69b src; }
          base; run base; tip; run new
          f=$(python -c "import histserv.chunked_hist as m;print(m.__file__)")
          cp "$f" /tmp/chunked_hist.orig
          for k in 1 4; do
            cp /tmp/chunked_hist.orig "$f"
            sed -i "s/^\(\s*\)self\._chunks\[key\] = np\.array(array, order=\"C\")\$/&\n\1globals().setdefault(\"_MUTANT\", []).extend(np.array(array, order=\"C\") for _ in range($k))/" "$f"
            grep -c '_MUTANT' "$f" | sed "s/^/PROBE mutant k=$k lines=/"
            base; run mutant$k-base; tip; run mutant$k-new
          done
