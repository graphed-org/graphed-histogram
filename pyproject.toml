[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphed-histogram"
version = "0.0.2"
description = "Deferred boost-histogram/hist filling on graphed task graphs (the dask-histogram analogue)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "graphed-org" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# graphed: the Plan + content-addressed task_id a fill records into. The 0.0.2 floor is the
# variation-aware fill lowering (varied weights, the variation axis, joint labels).
dependencies = ["graphed>=0.0.2", "boost-histogram>=1.4", "numpy>=1.24"]

[project.optional-dependencies]
# the backends + corpus + exec-local exercise resume on a realistic HEP analysis end-to-end.
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "mypy",
  "ruff",
  "graphed[awkward,numpy]>=0.0.2",
  "awkward>=2.6",
  "graphed-executors>=0.0.2",
  "hist>=2.7",
  # parquet-reading tests: awkward's arrow->form conversion calls to_pandas_dtype (the
  # graphed-awkward dev-extra precedent)
  "pyarrow",
  "pandas",
]
docs = ["sphinx", "furo"]

[project.urls]
Homepage = "https://github.com/graphed-org/graphed-histogram"

[tool.hatch.build.targets.wheel]
packages = ["src/graphed_histogram"]

# The agent-guidance file and the internal development log are not part of the distribution.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".graphed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/frozen/m23", "tests/_corpus"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["graphed_histogram"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PLC0415"]
ignore = ["E501"]

[tool.ruff.format]
# ruff formats python blocks inside .md, which reflows the README's examples (aligned trailing
# comments, deliberate one-liners) into something less readable. The prek hooks only ever hand
# python/pyi files to the formatter, so excluding Markdown keeps a bare `ruff format --check .`
# — the command CONTRIBUTING gives — agreeing with what CI runs.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# boost_histogram ships no py.typed: the deferred Histogram subclasses an Any base deliberately
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["numpy.*", "boost_histogram.*", "awkward.*", "graphed.numpy.*", "graphed_exec_local.*", "hist.*", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

# tests/frozen/** is read-only, so its residual errors are disabled here rather than annotated
# away. The test tree has no __init__.py (pytest's prepend import mode), so mypy names these
# modules by bare basename and its override patterns cannot glob a single component -- hence the
# explicit list instead of `tests.frozen.*`. Regenerate:
#   python -c "import pathlib;print(sorted(p.stem for p in pathlib.Path('tests/frozen').rglob('*.py')))"
[[tool.mypy.overrides]]
module = [
  "behavior_toy",
  "m49_hist_fixtures",
  "m50_axis_fixtures",
  "m52_joint_fill_fixtures",
  "test_ambient_object_fills",
  "test_axis_declaration",
  "test_axis_mode_equality",
  "test_axis_result_shape",
  "test_axis_slot_scaling",
  "test_blame_parity",
  "test_broadcast_seam_row_spaces",
  "test_corpus_weight_matrix",
  "test_deferred_histograms",
  "test_fill_arity",
  "test_fill_divergence",
  "test_fill_flatten_refusals",
  "test_fill_fold_order",
  "test_fill_reindexing",
  "test_fill_unweighted",
  "test_golden_side_strip",
  "test_group_plan",
  "test_jer_stochastic",
  "test_joint_axis_mode_parity",
  "test_joint_fill_resolution",
  "test_merge_shortfall",
  "test_mixed_mode_plan",
  "test_multi_weight_fills",
  "test_optimizer_merge_guard",
  "test_output_label_listing",
  "test_points_bare_histogram",
  "test_process_executor_witnesses",
  "test_reference_matrix",
  "test_selection_invariance",
  "test_shift_ordering",
  "test_single_fallback_rule",
  "test_variation_goldens",
  "test_variation_labels_payload",
  "test_varied_plan_refusal",
  "test_varied_result_shapes",
  "test_weight_factor_reindex",
  "vary_hist_fixtures",
]
disable_error_code = ["attr-defined", "arg-type", "no-any-return", "no-untyped-call", "type-arg", "unused-ignore", "union-attr", "index", "no-untyped-def"]
