[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphed-histogram"
version = "0.0.6"
description = "Deferred boost-histogram/hist filling on graphed task graphs (the dask-histogram analogue)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "graphed-org" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# graphed: the Plan + content-addressed task_id a fill records into. The 0.0.7 floor is
# graphed.services, which histserv imports.
# hist 2.11: the first with hist.chunked, which holds the chunked partials; it needs
# boost-histogram >=1.7 (and caps it below 1.9).
dependencies = ["graphed>=0.0.9", "boost-histogram>=1.7", "numpy>=1.24", "hist>=2.11"]

[project.optional-dependencies]
# the backends + corpus + exec-local exercise resume on a realistic HEP analysis end-to-end.
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "mypy",
  "ruff",
  "graphed[awkward,numpy]>=0.0.2",
  "awkward>=2.6",
  "graphed-executors",
  # hist 2.12 is the first with hist.graphed; uhi 1.0 the first with uhi.io.json
  "hist>=2.12",
  "uhi>=1.0",
  # parquet-reading tests: awkward's arrow->form conversion calls to_pandas_dtype (the
  # graphed-awkward dev-extra precedent)
  "pyarrow",
  "pandas",
  "diff_cover",
]
docs = ["sphinx", "furo"]
# filling on histserv servers (graphed_histogram.histserv); grpcio ships no free-threaded wheel
histserv = ["histserv>=0.2.1,<0.3"]

[project.urls]
Homepage = "https://github.com/graphed-org/graphed-histogram"

[tool.hatch.build.targets.wheel]
packages = ["src/graphed_histogram"]

# The agent-guidance file and the internal development log are not part of the distribution.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".graphed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/frozen/m23", "tests/_corpus"]
addopts = "-q"
# Below run_bounded's 240 s, so a hang prints the stuck stack before the bare HARD TIMEOUT.
faulthandler_timeout = 200

[tool.coverage.run]
branch = true
source = ["graphed_histogram"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
# PEP 8's team maximum
line-length = 99
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PLC0415", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# A test's name is its summary line: its docstring, when it has one, elaborates the property under
# test as one paragraph rather than issuing a command.
"tests/**" = ["D1", "D205", "D401"]
# These frozen test names are test IDs, which capitalize words for emphasis.
"tests/frozen/m48/test_ambient_object_fills.py" = ["N802"]
"tests/frozen/m48/test_fill_flatten_refusals.py" = ["N802"]
"tests/frozen/m48/test_fill_reindexing.py" = ["N802"]
"tests/frozen/m48/test_fill_unweighted.py" = ["N802"]
"tests/frozen/m48/test_varied_result_shapes.py" = ["N802"]
"tests/frozen/m49/test_merge_shortfall.py" = ["N802"]
"tests/frozen/m49/test_variation_labels_payload.py" = ["N802"]
# awkward is an optional dependency, imported only once a fill is handed an awkward array.
"src/graphed_histogram/boost.py" = ["PLC0415"]
# histserv and grpc are optional dependencies, imported only once a bound run talks to a server.
"src/graphed_histogram/_histserv.py" = ["PLC0415"]

[tool.ruff.format]
# ruff formats python blocks inside .md, which reflows the README's examples (aligned trailing
# comments, deliberate one-liners) into something less readable. The prek hooks only ever hand
# python/pyi files to the formatter, so excluding Markdown keeps a bare `ruff format --check .`
# — the command CONTRIBUTING gives — agreeing with what CI runs.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# boost_histogram ships no py.typed: the deferred Histogram subclasses an Any base deliberately
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["numpy.*", "boost_histogram.*", "awkward.*", "graphed.numpy.*", "graphed_exec_local.*", "hist.*", "pyarrow.*", "histserv.*", "grpc.*"]
ignore_missing_imports = true
follow_imports = "skip"
